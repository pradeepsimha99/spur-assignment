services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: spur-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: spur_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: spur-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spur-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/spur_chat"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GROQ_BASE_URL: "https://api.groq.com/openai/v1"
      GROQ_MODEL: "llama-3.3-70b-versatile"
      LLM_MAX_TOKENS: "500"
      LLM_MAX_MESSAGES: "20"
      LLM_TEMPERATURE: "0.7"
      REDIS_URL: "redis://redis:6379"
      REDIS_ENABLED: "true"
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spur-frontend
    ports:
      - "5173:3000"
    environment:
      NODE_ENV: production
      VITE_API_URL: "http://localhost:3001"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
